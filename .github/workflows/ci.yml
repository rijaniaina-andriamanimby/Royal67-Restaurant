
name: Royal67 CI

on:
  push:
    branches:
      - main
      - devsecops/docker-ci

  pull_request:
    branches:
      - main
      - devsecops/docker-ci

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend - Jest Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest tests
        working-directory: server
        run: npm test -- --runInBand

  frontend-build:
    name: Frontend - Vite Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build
