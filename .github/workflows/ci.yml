
name: Royal67 CI

on:
  push:
    branches:
      - main
      - devsecops/docker-ci

  pull_request:
    branches:
      - main
      - devsecops/docker-ci

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend - Jest Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest tests
        working-directory: server
        run: npm test -- --runInBand

  frontend-build:
    name: Frontend - Vite Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

  security-sast:
    name: Security - Semgrep SAST
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:1.182.1 \
            semgrep scan \
            --config p/default \
            --json \
            --output semgrep-report.json \
            --exclude node_modules \
            --exclude dist \
            server client

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          if-no-files-found: warn
          retention-days: 30

  security-trivy:
    name: Security - Trivy Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Analyse des fichiers du projet
      - name: Trivy - Filesystem Scan
        run: |
          mkdir -p reports

          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            aquasec/trivy:0.69.3 \
            fs \
            --scanners vuln,misconfig,secret \
            --timeout 20m \
            --skip-dirs node_modules \
            --skip-dirs dist \
            --format json \
            --output /src/reports/trivy-fs-report.json \
            .

      # 2. Construction de l'image backend
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t restaurant-backend:ci \
            ./server

      # 3. Construction de l'image frontend
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t restaurant-frontend:ci \
            ./client

      # 4. Analyse de l'image backend
      - name: Trivy - Backend Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/src" \
            -v trivy-cache:/root/.cache/ \
            -w /src \
            aquasec/trivy:0.69.3 \
            image \
            --scanners vuln,misconfig,secret \
            --timeout 20m \
            --format json \
            --output /src/reports/trivy-backend-image-report.json \
            restaurant-backend:ci

      # 5. Analyse de l'image frontend
      - name: Trivy - Frontend Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/src" \
            -v trivy-cache:/root/.cache/ \
            -w /src \
            aquasec/trivy:0.69.3 \
            image \
            --scanners vuln,misconfig,secret \
            --timeout 20m \
            --format json \
            --output /src/reports/trivy-frontend-image-report.json \
            restaurant-frontend:ci

      # 6. Publication des rapports
      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
